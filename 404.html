<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Youlo182</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a1628; --card:#122138; --ink:#e8eef6; --muted:#9fb0c6; --accent:#8B1E3F; --accent-l:#b03d5e; --line:#1e3050; }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito Sans',sans-serif;}
  body{ background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .box{ max-width:480px; }
  .logo{ display:inline-flex; align-items:center; justify-content:center; width:90px; height:90px; border-radius:50%; background:var(--accent); border:3px solid #f5e6d3; color:#f5e6d3; font-size:26px; font-weight:800; margin-bottom:22px; }
  h1{ font-family:'Cormorant Garamond',serif; font-size:80px; color:var(--accent-l); line-height:1; margin-bottom:8px; }
  h2{ font-family:'Cormorant Garamond',serif; font-size:26px; color:var(--ink); margin-bottom:14px; }
  p{ color:var(--muted); line-height:1.6; margin-bottom:24px; }
  a.btn{ display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:12px 26px; border-radius:24px; font-weight:700; box-shadow:0 6px 20px rgba(176,61,94,.4); transition:transform .15s, background .2s; }
  a.btn:hover{ background:var(--accent-l); transform:translateY(-2px); }
  .small{ margin-top:18px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">·¥182·</div>
    <h1>404</h1>
    <h2>Oups, cette page n'existe pas 💛</h2>
    <p>On dirait que Carina et Maya se sont perdues en chemin... Cette page est introuvable ou a été déplacée.</p>
    <a class="btn" href="/">📖 Retour à mes histoires</a>
    <p class="small">Youlo182 — Fanfictions</p>
  </div>
</body>
</html>
